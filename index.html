<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky: Children of the Light</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixed Header / Menu -->
    <header>
        <nav class="navbar">
            <div class="logo">Sky</div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#community">Community</a></li>
            </ul>
        </nav>
    </header>

    <!-- Home Section (Background Image) -->
    <section id="home" class="hero">
    </section>

    
    <!-- About Section -->
<section id="about" class="section">
    <h2>Discover The Realms</h2>
    <p>Welcome to the enchanting world of Sky, a beautifully-animated kingdom waiting to be explored by you and your loved ones.</p>
    
    <!-- DITO LALABAS ANG PICTURE MO -->
    <img src="Hero — Explore an Open-World.png" alt="Sky Screenshot" class="section-img">
</section>

   <!-- Features Section -->
<section id="features" style="width: 100%; text-align: center;">
    <img src="Features Meet & Help.png" alt="Features Section" style="width: 100%; height: auto; display: block;">
</section>

<!-- Gallery Section -->
<section id="gallery" style="width: 100%; text-align: center;">
    <img src="Gallery Sky Moments.png" alt="Gallery Section" style="width: 100%; height: auto; display: block;">
</section>

<!-- Community Section -->
<section id="community" style="width: 100%; text-align: center; display: block;">
    <img src="CTA Join the Journey.png" alt="Join the Journey" style="width: 100%; max-width: 100%; height: auto; display: block; margin: 0 auto;">
</section>

</body>
</html>
